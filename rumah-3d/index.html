<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!--ARTIFACT-START-->
<title>Rumah 6×12 Tiga Dimensi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: kanvas 3D layar penuh; panel denah melayang di kiri (desktop) / lembar bawah (ponsel) */
:root {
  --bg: #e7ebee;
  --panel: rgba(250, 250, 248, 0.94);
  --fg: #1d1f21;
  --muted: #5d6266;
  --line: #d6d9db;
  --accent: #2b2d30;
  --accent-fg: #f7f7f5;
  --warm: #b07a45;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --panel: rgba(28, 30, 33, 0.93); --fg: #eceeef; --muted: #a2a8ad;
    --line: #34383c; --accent: #eceeef; --accent-fg: #17191b; --warm: #d39a62; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --panel: rgba(28, 30, 33, 0.93); --fg: #eceeef; --muted: #a2a8ad;
  --line: #34383c; --accent: #eceeef; --accent-fg: #17191b; --warm: #d39a62; color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); overflow: hidden; }
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; touch-action: none; }

.panel {
  position: fixed; z-index: 5;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  width: 320px; max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; background: var(--panel); backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 18px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box;
}
.panel > * { flex-shrink: 0; }
.eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 24px/1.1 var(--f-display); margin: 6px 0 0; text-wrap: balance; }
.sub { font-size: 13px; color: var(--muted); margin: 4px 0 0; }

.rooms { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.rooms button {
  font: 500 13px/1.2 var(--f-body); color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 3px;
}
.rooms button span { font: 400 10.5px var(--f-mono); color: var(--muted); white-space: nowrap; }
.rooms button:hover { border-color: var(--muted); }
.rooms button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.rooms button[aria-pressed="true"] span { color: inherit; opacity: .7; }
.rooms button:focus-visible, .toggles input:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
.rooms .wide { grid-column: span 2; flex-direction: row; justify-content: space-between; align-items: baseline; }

.info { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.info h2 { font: 700 18px/1.15 var(--f-display); margin: 0; }
.dim { font: 500 12px var(--f-mono); color: var(--warm); font-variant-numeric: tabular-nums; }
.info ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.5; display: flex; flex-direction: column; gap: 2px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.sw { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); }
.sw i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }

.toggles { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; border-top: 1px solid var(--line); padding-top: 12px; }
.toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.hint { font-size: 11.5px; color: var(--muted); margin: 0; }

.lbl {
  font: 600 11px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase;
  color: #1d1f21; background: rgba(255,255,255,.88); padding: 4px 7px; border-radius: 4px;
  white-space: nowrap; pointer-events: none; border: 1px solid rgba(0,0,0,.12);
}
.hide-labels .lbl { display: none; }

@media (max-width: 720px) {
  .panel {
    top: auto; bottom: 0; left: 0; right: 0; width: auto; border-radius: 12px 12px 0 0;
    max-height: 46%; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    gap: 10px;
  }
  h1 { font-size: 19px; }
  .rooms { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 2px; }
  .rooms button { flex: 0 0 auto; }
  .sub, .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div id="scene" aria-label="Model 3D rumah, seret untuk memutar"></div>

<aside class="panel">
  <div>
    <div class="eyebrow">Lahan 6 × 12 m · 2 KT · 1 KM</div>
    <h1>Rumah Minimalis Hitam-Putih</h1>
    <p class="sub">Model 3D dari denah, fasad mengikuti foto rumah contoh.</p>
  </div>
  <nav class="rooms" id="rooms"></nav>
  <section class="info" id="info" aria-live="polite"></section>
  <div class="toggles">
    <label><input type="checkbox" id="tRoof"> Atap</label>
    <label><input type="checkbox" id="tCut" checked> Potong dinding</label>
    <label><input type="checkbox" id="tLabel" checked> Label</label>
  </div>
  <p class="hint">Seret untuk memutar · scroll/cubit untuk zoom · klik kanan / dua jari untuk geser.</p>
</aside>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
(() => {
/* Koordinat (meter): x 0→6 kiri→kanan denah, z 0 = belakang (dapur), z 12 = jalan (carport). */
const H = 3.2, T = 0.15, CUT_H = 1.25;
const host = document.getElementById('scene');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
host.appendChild(renderer.domElement);

const labelR = new THREE.CSS2DRenderer();
labelR.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none';
host.appendChild(labelR.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfd9e0);
scene.fog = new THREE.Fog(0xcfd9e0, 35, 80);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
camera.position.set(14, 15, 20);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(3, 0.5, 6);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.minDistance = 2; controls.maxDistance = 45;

/* ---------- cahaya ---------- */
scene.add(new THREE.HemisphereLight(0xeef3f7, 0x8c8578, 0.75));
const sun = new THREE.DirectionalLight(0xfff3e2, 0.85);
sun.position.set(-9, 18, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 50 });
sun.shadow.bias = -0.0006;
sun.target.position.set(3, 0, 6);
scene.add(sun, sun.target);

/* ---------- tekstur prosedural ---------- */
function canvasTex(size, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 4;
  return t;
}
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function veins(g, s, color, n, seed, w) {
  const r = rng(seed); g.strokeStyle = color;
  for (let i = 0; i < n; i++) {
    g.lineWidth = w * (0.4 + r()); g.beginPath();
    let x = r() * s, y = r() * s; g.moveTo(x, y);
    for (let k = 0; k < 6; k++) { x += (r() - .35) * s * .25; y += (r() - .5) * s * .25; g.lineTo(x, y); }
    g.stroke();
  }
}
const marbleImg = (g, s) => {
  g.fillStyle = '#f1f0ec'; g.fillRect(0, 0, s, s);
  veins(g, s, 'rgba(150,140,125,.35)', 9, 7, 2); veins(g, s, 'rgba(120,110,95,.25)', 5, 31, 1);
  g.strokeStyle = 'rgba(0,0,0,.10)'; g.lineWidth = 2; g.strokeRect(0, 0, s, s);
};
const darkMarbleImg = (g, s) => {
  g.fillStyle = '#1e1f21'; g.fillRect(0, 0, s, s);
  veins(g, s, 'rgba(230,225,215,.35)', 8, 11, 1.6); veins(g, s, 'rgba(160,150,140,.25)', 6, 53, 1);
  g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 2; g.strokeRect(0, 0, s, s);
};
const woodImg = (g, s) => {
  g.fillStyle = '#a8743f'; g.fillRect(0, 0, s, s);
  const r = rng(5);
  for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(${70 + r() * 40},${40 + r() * 20},15,${.08 + r() * .12})`; g.fillRect(0, r() * s, s, 1 + r() * 3); }
};
const grassImg = (g, s) => {
  g.fillStyle = '#5f8a3e'; g.fillRect(0, 0, s, s);
  const r = rng(3);
  for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(${40 + r() * 60},${100 + r() * 60},${30 + r() * 30},.6)`; g.fillRect(r() * s, r() * s, 1.5, 3); }
};
const concreteImg = (g, s) => {
  g.fillStyle = '#c9c7c2'; g.fillRect(0, 0, s, s);
  const r = rng(9);
  for (let i = 0; i < 3000; i++) { const v = 150 + r() * 70; g.fillStyle = `rgba(${v},${v},${v - 5},.35)`; g.fillRect(r() * s, r() * s, 2, 2); }
  g.strokeStyle = 'rgba(80,80,80,.25)'; g.lineWidth = 2; g.strokeRect(0, 0, s, s);
};
const asphaltImg = (g, s) => {
  g.fillStyle = '#4a4c4f'; g.fillRect(0, 0, s, s);
  const r = rng(13);
  for (let i = 0; i < 4000; i++) { const v = 50 + r() * 80; g.fillStyle = `rgba(${v},${v},${v},.5)`; g.fillRect(r() * s, r() * s, 1.5, 1.5); }
};
const T_ = {
  marble: canvasTex(512, marbleImg), dark: canvasTex(512, darkMarbleImg), wood: canvasTex(256, woodImg),
  grass: canvasTex(256, grassImg), concrete: canvasTex(256, concreteImg), asphalt: canvasTex(256, asphaltImg),
};
function tiled(key, w, d, tile) {
  const t = T_[key].clone(); t.needsUpdate = true; t.repeat.set(w / tile, d / tile); return t;
}

/* ---------- material ---------- */
const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.85, metalness: 0 }, o));
const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), CUT_H);
const clippable = [];
const cm = (m) => { m.side = THREE.DoubleSide; clippable.push(m); return m; };
const M = {
  wall: cm(std(0xf3f2ee, { roughness: 0.95 })),
  charcoal: cm(std(0x303236, { roughness: 0.7 })),
  frame: cm(std(0x17181a, { roughness: 0.5, metalness: 0.3 })),
  glass: cm(new THREE.MeshStandardMaterial({ color: 0x8aa3b0, roughness: 0.05, metalness: 0.2, transparent: true, opacity: 0.35 })),
  skirt: cm(std(0xffffff, { map: canvasTex(512, darkMarbleImg, 3, 1), roughness: 0.4 })),
  wallDark: cm(std(0xffffff, { map: canvasTex(512, darkMarbleImg, 1, 1.5), roughness: 0.35 })),
  doorBlack: cm(std(0x1b1c1e, { roughness: 0.55 })),
  doorWood: cm(std(0xffffff, { map: T_.wood, roughness: 0.6 })),
  slat: cm(std(0xffffff, { map: T_.wood, roughness: 0.6 })),
  roof: std(0x222427, { roughness: 0.75, side: THREE.DoubleSide, flatShading: true }),
  fascia: std(0xf3f2ee),
  steel: std(0x111214, { roughness: 0.45, metalness: 0.5 }),
  poly: new THREE.MeshStandardMaterial({ color: 0xe9dcc0, roughness: 0.6, transparent: true, opacity: 0.85, side: THREE.DoubleSide }),
  wood: std(0xffffff, { map: T_.wood, roughness: 0.55 }),
  woodLight: std(0xd2b48c, { roughness: 0.6 }),
  walnut: std(0x6e4b33, { roughness: 0.55 }),
  cabinet: std(0x2a2b2e, { roughness: 0.6 }),
  quartz: std(0xf4f3f0, { roughness: 0.25 }),
  inox: std(0xb5babd, { roughness: 0.3, metalness: 0.8 }),
  blackGlass: std(0x0c0d0f, { roughness: 0.15, metalness: 0.3 }),
  porcelain: std(0xf6f6f4, { roughness: 0.2 }),
  mirror: std(0xcfd8dd, { roughness: 0.05, metalness: 0.9 }),
  sofa: std(0xc8b195), sofaDeep: std(0xb89f82), rug: std(0xd9d0c2), rugWarm: std(0xc9bba8),
  linen: std(0xeceae4), grey: std(0x8f9092), greyDark: std(0x63676b), headboard: std(0xbab3a8),
  orange: std(0xd7882c), teal: std(0x4a7b84), slate: std(0x4a555c), cushion: std(0xe3d6c3),
  leaf: std(0x4d7b36), leafDark: std(0x3a6229), leafBlue: std(0x7aa6a3), bloom: std(0x8c3a45),
  pot: std(0xe9e6df, { roughness: 0.7 }), potDark: std(0x2b2c2e),
  screen: std(0x08090a, { roughness: 0.15, metalness: 0.4 }),
  bulb: new THREE.MeshStandardMaterial({ color: 0xfff1d0, emissive: 0xffd99a, emissiveIntensity: 1.2 }),
  carWhite: std(0xf5f5f3, { roughness: 0.25, metalness: 0.3 }), carGlass: std(0x1a2026, { roughness: 0.1, metalness: 0.5 }),
  tyre: std(0x1a1a1a, { roughness: 0.9 }), red: std(0xc0262d, { emissive: 0x400000 }),
  wardrobe: cm(std(0xe7e3da, { roughness: 0.5 })), curtain: cm(std(0xe3d6c3)), rod: cm(std(0x111214, { metalness: 0.5, roughness: 0.45 })),
  bulbWall: cm(new THREE.MeshStandardMaterial({ color: 0xfff1d0, emissive: 0xffd99a, emissiveIntensity: 1.2 })),
  soil: std(0x5a4232), curb: std(0xd8d6d1), white: std(0xf3f2ee),
  marbleFloor: (w, d) => std(0xffffff, { map: tiled('marble', w, d, 0.6), roughness: 0.3 }),
  darkFloor: (w, d) => std(0xffffff, { map: tiled('dark', w, d, 0.6), roughness: 0.3 }),
  grass: (w, d) => std(0xffffff, { map: tiled('grass', w, d, 1.5) }),
  concrete: (w, d) => std(0xffffff, { map: tiled('concrete', w, d, 1.2) }),
  asphalt: (w, d) => std(0xffffff, { map: tiled('asphalt', w, d, 3) }),
};

/* ---------- helper geometri ---------- */
const groups = { house: new THREE.Group(), roof: new THREE.Group(), labels: new THREE.Group() };
Object.values(groups).forEach(g => scene.add(g));
let parent = groups.house;
function add(mesh, cast = true) { mesh.castShadow = cast; mesh.receiveShadow = true; parent.add(mesh); return mesh; }
// B: kotak, y = alas
function B(w, h, d, mat, x, y, z, rotY = 0) {
  const m = add(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat));
  m.position.set(x, y + h / 2, z); m.rotation.y = rotY; return m;
}
// Bx: kotak dari batas min/max
function Bx(x0, x1, y0, y1, z0, z1, mat) { return B(x1 - x0, y1 - y0, z1 - z0, mat, (x0 + x1) / 2, y0, (z0 + z1) / 2); }
function C(rt, rb, h, mat, x, y, z, seg = 24) {
  const m = add(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat));
  m.position.set(x, y + h / 2, z); return m;
}
function S(r, mat, x, y, z, sx = 1, sy = 1, sz = 1) {
  const m = add(new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), mat));
  m.position.set(x, y, z); m.scale.set(sx, sy, sz); return m;
}
function plane(x0, x1, z0, z1, y, mat) {
  const m = add(new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, z1 - z0), mat), false);
  m.rotation.x = -Math.PI / 2; m.position.set((x0 + x1) / 2, y, (z0 + z1) / 2); return m;
}

/* Dinding: axis 'x' = membentang sepanjang x pada z=line; 'z' = sepanjang z pada x=line.
   ops: bukaan {a,b,y0,y1} dalam koordinat global sepanjang sumbu. */
function wall(axis, line, s, e, ops = [], o = {}) {
  const h = o.h ?? H, t = o.t ?? T, mat = o.mat ?? M.wall;
  s -= t / 2; e += t / 2;
  const seg = (a, b, y0, y1) => {
    if (b - a < 1e-3 || y1 - y0 < 1e-3) return;
    if (axis === 'x') Bx(a, b, y0, y1, line - t / 2, line + t / 2, mat);
    else Bx(line - t / 2, line + t / 2, y0, y1, a, b, mat);
  };
  let cur = s;
  [...ops].sort((p, q) => p.a - q.a).forEach(op => {
    seg(cur, op.a, 0, h); seg(op.a, op.b, 0, op.y0); seg(op.a, op.b, op.y1, h); cur = op.b;
  });
  seg(cur, e, 0, h);
}
function along(axis, line, a, b, y0, y1, depth, mat, off = 0) {
  return axis === 'x' ? Bx(a, b, y0, y1, line - depth / 2 + off, line + depth / 2 + off, mat)
                      : Bx(line - depth / 2 + off, line + depth / 2 + off, y0, y1, a, b, mat);
}
// Jendela kusen hitam dengan kisi (seperti foto)
function windowAt(axis, line, a, b, y0, y1, cols = 2, rows = 3) {
  const f = 0.055, d = T + 0.03;
  along(axis, line, a, b, y0, y0 + f, d, M.frame); along(axis, line, a, b, y1 - f, y1, d, M.frame);
  along(axis, line, a, a + f, y0, y1, d, M.frame); along(axis, line, b - f, b, y0, y1, d, M.frame);
  along(axis, line, a, b, y0, y1, 0.012, M.glass).castShadow = false;
  const sash = (b - a) / cols;
  for (let i = 1; i < cols; i++) along(axis, line, a + sash * i - 0.03, a + sash * i + 0.03, y0, y1, d, M.frame);
  for (let i = 0; i < cols; i++) {
    const sa = a + sash * i, sb = sa + sash, mid = (sa + sb) / 2;
    along(axis, line, mid - 0.012, mid + 0.012, y0, y1, 0.05, M.frame);
    for (let r = 1; r < rows; r++) { const y = y0 + (y1 - y0) * r / rows; along(axis, line, sa, sb, y - 0.012, y + 0.012, 0.05, M.frame); }
  }
}
// Pintu: daun berputar dari engsel ke sisi `side` (+1/-1 terhadap normal dinding)
function doorAt(axis, line, a, b, { hinge = 'a', side = 1, open = 1.15, mat = M.doorWood, h = 2.1 } = {}) {
  const w = b - a, f = 0.05, d = T + 0.03;
  along(axis, line, a - f, a, 0, h + f, d, M.frame); along(axis, line, b, b + f, 0, h + f, d, M.frame);
  along(axis, line, a - f, b + f, h, h + f, d, M.frame);
  const sign = hinge === 'a' ? 1 : -1, hc = hinge === 'a' ? a : b;
  const dv = axis === 'x' ? [sign, 0] : [0, sign], nv = axis === 'x' ? [0, side] : [side, 0];
  const fx = dv[0] * Math.cos(open) + nv[0] * Math.sin(open), fz = dv[1] * Math.cos(open) + nv[1] * Math.sin(open);
  const g = new THREE.Group();
  g.position.set(axis === 'x' ? hc : line + side * T / 2, 0, axis === 'x' ? line + side * T / 2 : hc);
  g.rotation.y = Math.atan2(-fz, fx);
  const prev = parent; parent = g;
  B(w - 0.02, h - 0.02, 0.04, mat, w / 2, 0.01, 0);
  if (mat === M.doorBlack) { // panel timbul pintu utama
    [[0.35, 1.05], [1.2, 1.95]].forEach(([y0, y1]) => { B(w * 0.32, y1 - y0, 0.06, M.doorBlack, w * 0.3, y0, 0); B(w * 0.32, y1 - y0, 0.06, M.doorBlack, w * 0.7, y0, 0); });
  }
  B(0.12, 0.02, 0.07, M.inox, w - 0.12, 1.0, 0);
  parent = prev; parent.add(g);
}
function plant(x, z, y = 0, size = 1, potMat = M.pot, leafMat = M.leaf) {

const roomsEl = document.getElementById('rooms'), infoEl = document.getElementById('info');
const tRoof = document.getElementById('tRoof'), tCut = document.getElementById('tCut'), tLabel = document.getElementById('tLabel');
ROOMS.forEach((r, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.id = 'room-' + r.id;
  if (r.id === 'semua') b.className = 'wide';
  b.innerHTML = `${r.name}<span>${r.dim}</span>`;
  b.addEventListener('click', () => select(r.id));
  roomsEl.appendChild(b);
});

function applyToggles() {
  groups.roof.visible = tRoof.checked;
  clippable.forEach(m => { m.clippingPlanes = tCut.checked ? [clipPlane] : []; m.needsUpdate = true; });
  document.body.classList.toggle('hide-labels', !tLabel.checked || tRoof.checked);
}
[tRoof, tCut, tLabel].forEach(el => el.addEventListener('change', applyToggles));

let tween = null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function select(id, instant) {
  const r = ROOMS.find(x => x.id === id) || ROOMS[0];
  [...roomsEl.children].forEach(b => b.setAttribute('aria-pressed', String(b.id === 'room-' + r.id)));
  infoEl.innerHTML = `<div class="dim">${r.dim}</div><h2>${r.name}</h2><ul>${r.notes.map(n => `<li>${n}</li>`).join('')}</ul>` +
    (r.sw.length ? `<div class="swatches">${r.sw.map(([c, n]) => `<span class="sw"><i style="background:${c}"></i>${n}</span>`).join('')}</div>` : '');
  tRoof.checked = r.roof; tCut.checked = r.cut; applyToggles();
  const toP = new THREE.Vector3(...r.cam), toT = new THREE.Vector3(...r.tgt);
  if (innerWidth <= 720) toP.sub(toT).multiplyScalar(1.35).add(toT);   // ponsel: mundur sedikit
  if (instant || reduce) { camera.position.copy(toP); controls.target.copy(toT); tween = null; }
  else tween = { t0: performance.now(), dur: 1100, fP: camera.position.clone(), fT: controls.target.clone(), toP, toT };
  try { history.replaceState(null, '', '#' + r.id); } catch (e) {}
}

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h); labelR.setSize(w, h);
  camera.aspect = w / h;
  // geser pusat pandang ke area yang tidak tertutup panel
  const pr = document.querySelector('.panel').getBoundingClientRect();
  if (w <= 720) camera.setViewOffset(w, h, 0, Math.round(pr.height / 2), w, h);
  else camera.setViewOffset(w, h, -Math.round((pr.right) / 2), 0, w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
renderer.setAnimationLoop(now => {
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = ease(k);
    camera.position.lerpVectors(tween.fP, tween.toP, e);
    controls.target.lerpVectors(tween.fT, tween.toT, e);
    if (k >= 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera); labelR.render(scene, camera);
});
controls.addEventListener('start', () => { tween = null; });

const start = location.hash.slice(1);
select(ROOMS.some(r => r.id === start) ? start : 'semua', true);
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (ROOMS.some(r => r.id === h)) select(h); });
})();
